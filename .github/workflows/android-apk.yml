# Builds an installable Android APK on GitHub's servers.
# Runs on every push to main, or by hand: Actions tab → "Build Android APK" → Run workflow.
# The APK appears under the run's "Artifacts" section as lectern-apk.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor and plugins
        run: npm install --no-audit --no-fund

      - name: Bundle the web app and sync it into Android
        run: |
          npm run build:web
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Lectern.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lectern-apk
          path: Lectern.apk
          if-no-files-found: error
