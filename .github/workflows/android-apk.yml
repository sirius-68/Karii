# Builds an installable Android APK on GitHub's servers.
# Runs on every push to main, or by hand: Actions tab → "Build Android APK" → Run workflow.
# The APK appears under the run's "Artifacts" section as lectern-apk.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    permissions:
      contents: write   # to publish the APK on the "apk" branch
    # ubuntu-24.04 ships with the Android SDK preinstalled (ANDROID_HOME is set).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check the Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "Android SDK not found"; exit 1; }
          ls "$ANDROID_HOME/platforms" | tail -5
          python3 --version

      - name: Install Capacitor and plugins
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee -a build.log

      - name: Bundle the web app and sync it into Android
        run: |
          set -o pipefail
          { npm run build:web && npx cap sync android; } 2>&1 | tee -a build.log

      - name: Build the APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee -a ../build.log
          cp app/build/outputs/apk/debug/app-debug.apk ../Lectern.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lectern-apk
          path: Lectern.apk
          if-no-files-found: error

      # Also keep the latest APK as a plain file on the "apk" branch, so it can be
      # downloaded from the repository's file list (Code → branch "apk" → Lectern.apk).
      - name: Publish to the apk branch
        run: |
          mkdir -p /tmp/apkbranch && cp Lectern.apk /tmp/apkbranch/
          printf 'Latest Android build of Lectern.\n\nBuilt from %s on %s.\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%d %H:%M UTC')" > /tmp/apkbranch/README.md
          cd /tmp/apkbranch
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Lectern.apk from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk:apk

      # On failure, surface the end of the build log as an annotation so it can be
      # read from the run summary (and through the API) without downloading logs.
      - name: Report build errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          tail -n 80 build.log | grep -v '^\s*$' | tail -n 60 > tail.log
          body=$(sed -e 's/%/%25/g' tail.log | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build log (last lines)::${body}"
