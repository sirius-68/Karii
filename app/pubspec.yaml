name: lectern
description: Lectern — a performance studio for spoken word, monologues, movie lines, speeches and lyrics, with a teleprompter, background music and recording. Native Android app (Flutter UI, C++ audio engine).
publish_to: 'none'
version: 3.1.0+31

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Camera and video player are pinned to exact versions: tool/patch_plugins.py changes the camera
  # plugin (no microphone capture by the camera), and a silent update must not change how takes
  # are recorded or played. Update them deliberately, then run the device test.
  camera: 0.12.2
  camera_android_camerax: 0.7.6+2
  video_player: 2.14.1
  video_player_android: 2.13.0
  path_provider: ^2.1.0
  share_plus: '>=11.0.0 <14.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/data/
